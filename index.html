<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Official social links for 1radu56 and SoundDex">
  <title>1radu56 — Links</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090b10;color:#f6f8fb;font:500 16px/1.4 system-ui,sans-serif}
    main{width:min(100%,560px)}
    h1{margin:0;font-size:clamp(2.4rem,10vw,4rem);line-height:1}
    p{margin:10px 0 24px;color:#93a0b4}
    nav{display:grid;gap:10px}
    a{display:flex;justify-content:space-between;padding:15px 18px;border:1px solid #2a3342;border-radius:10px;background:#11151d;color:inherit;text-decoration:none;transition:.15s}
    a:hover,a:focus-visible{border-color:#b8f216;transform:translateY(-2px);outline:none}
    a::after{content:"↗";color:#93a0b4}
    #status{text-align:center}
  </style>
</head>
<body>
  <main>
    <h1>1radu56</h1>
    <p>SoundDex creator · official links</p>
    <nav id="links"><span id="status">Loading…</span></nav>
  </main>

  <script>
    const names={
      "tiktok.com":"TikTok","facebook.com":"Facebook","reddit.com":"Reddit",
      "twitch.tv":"Twitch","modrinth.com":"Modrinth","roblox.com":"Roblox",
      "x.com":"X","discord.com":"Discord"
    };

    fetch("links.txt")
      .then(response=>response.ok?response.text():Promise.reject())
      .then(text=>{
        const list=document.querySelector("#links");
        list.replaceChildren();

        for(const line of text.split(/\r?\n/)){
          const value=line.trim();
          if(!value)continue;

          try{
            const url=new URL(value);
            if(!["http:","https:"].includes(url.protocol))continue;

            const host=url.hostname.replace(/^www\./,"");
            const link=document.createElement("a");
            link.href=url.href;
            link.textContent=names[host]||host;
            link.target="_blank";
            link.rel="noopener noreferrer";
            list.append(link);
          }catch{}
        }

        if(!list.children.length)list.textContent="No links yet.";
      })
      .catch(()=>document.querySelector("#status").textContent="Could not load links.");
  </script>
</body>
</html>
